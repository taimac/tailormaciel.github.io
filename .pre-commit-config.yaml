repos:
  - repo: https://github.com/psf/black
    rev: "25.1.0" # Synchronized with local version
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/PyCQA/isort
    rev: "5.12.0"
    hooks:
      - id: isort

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: "v0.12.9"
    hooks:
      - id: ruff
        args: [--fix]
